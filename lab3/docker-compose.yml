services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab3-rental:1.0
    container_name: lab3-rental
    env_file:
      - .env
    environment:
      # переменные окружения: порт, уровень логирования и поведение внешних
      # участников (позволяют пройти альтернативные пути процесса)
      PORT: "8000"
      LOG_LEVEL: "INFO"
      PAYMENT_APPROVE_AUTH: "true"
      PAYMENT_CAPTURE_OK: "true"
      PARKING_ALLOWED: "true"
      PARKING_ZONE: "Зона А"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
