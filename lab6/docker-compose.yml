services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://food:food@postgres:5432/food
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  data:
